<!doctype html><html><head><meta charset="utf-8"><style>:root{font-family:var(--font-sans)}body{margin:0;color:var(--foreground)}select{font:inherit;color:var(--foreground);background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:8px;width:100%}p{font-size:13px;color:var(--muted-foreground);line-height:1.45;margin:10px 0}.legend{display:flex;gap:20px;font-size:12px;margin:14px 0}.key{display:inline-block;width:12px;height:12px;border-radius:2px;background:var(--chart-1);margin-right:6px}.after{background:var(--chart-2)}.chart{height:340px}.case{margin:15px 0}.label{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:7px}.row{display:grid;grid-template-columns:1fr 88px;gap:12px;align-items:center;height:22px}.track{height:14px;background:var(--secondary);border-radius:3px;overflow:hidden}.bar{height:14px;background:var(--chart-1)}.candidate{background:var(--chart-2)}.value{font:12px var(--font-mono);text-align:right}.status{color:var(--foreground);font-size:13px;font-weight:600}.detail{font-size:12px;color:var(--muted-foreground)}</style></head><body><p class="status">Upstream integration remains blocked by the strict performance gate.</p><select id="group" aria-label="Measurement boundary"></select><p id="note"></p><div class="legend"><span><i class="key"></i>Before</span><span><i class="key after"></i>Upstream candidate</span></div><div class="chart" id="chart"></div><p class="detail">Milliseconds, lower is faster. Each group uses its own scale. Medians are descriptive; all samples and paired rechecks are retained in the report evidence.</p><script>const groups=[{"name":"Complete wrapper","note":"Current unified wrapper calls. Full process completion; 15 alternating pairs.","rows":[{"label":"go-30","before":14.940581000000066,"after":14.724492000000055},{"label":"go-1000","before":81.77529900000036,"after":81.14380600000004},{"label":"go-12000","before":863.341505999997,"after":856.0026030000008},{"label":"go-history-colored","before":1320.3761680000025,"after":1315.2043170000106}]},{"name":"Rejected renderer costs","note":"Actual calls including restored highlighting and corrected gutter styles. These losses block the merge.","rows":[{"label":"12K Go deletion · unified","before":41.30252999999993,"after":446.42855499999996},{"label":"12K Go deletion · side-by-side","before":117.51044900000124,"after":568.553093999999},{"label":"rust-history · side-by-side","before":474.9732030000014,"after":491.4062400000039},{"label":"go-history · side-by-side","before":1817.2183339999756,"after":1859.0615359999938}]},{"name":"True-color ingestion","note":"Fresh lazygit view population and diff identity extraction. Renderer execution and physical redraw are excluded.","rows":[{"label":"go-1000 · fresh view","before":33.432125,"after":43.135343},{"label":"go-12000 · fresh view","before":441.144311,"after":578.702394}]},{"name":"Streaming first body","note":"A 200 ms producer pause. The hunk option is new; its comparison uses unified layout as the baseline.","rows":[{"label":"direct","before":11.193940999997722,"after":11.038214000000153},{"label":"native","before":206.78541799999948,"after":206.7366750000001},{"label":"hunk-partial-context","before":10.215979000000061,"after":204.51661000000013}]}];const select=document.getElementById('group');groups.forEach((g,i)=>select.add(new Option(g.name,i)));function draw(){const g=groups[Number(select.value)];document.getElementById('note').textContent=g.note;const max=Math.max(...g.rows.flatMap(r=>[r.before,r.after]));document.getElementById('chart').innerHTML=g.rows.map(r=>'<section class="case"><div class="label">'+r.label+'</div><div class="row"><div class="track"><div class="bar" style="width:'+100*r.before/max+'%"></div></div><span class="value">'+r.before.toFixed(2)+' ms</span></div><div class="row"><div class="track"><div class="bar candidate" style="width:'+100*r.after/max+'%"></div></div><span class="value">'+r.after.toFixed(2)+' ms</span></div></section>').join('')}select.addEventListener('change',draw);select.value='1';draw();</script></body></html>
